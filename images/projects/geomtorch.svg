<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#gBg)" />
  
  <!-- Icosahedron / Geodesic Sphere wireframe -->
  <g transform="translate(300, 160) scale(1.1)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 6" />
    
    <!-- Geometric Polyhedron Edges -->
    <polygon points="0,-80 75,-30 48,65 -48,65 -75,-30" fill="rgba(56, 189, 248, 0.08)" stroke="url(#gNeon)" stroke-width="2.5" />
    <polygon points="0,-80 0,25 48,65" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <polygon points="0,-80 0,25 -48,65" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <polygon points="-75,-30 0,25 75,-30" fill="none" stroke="#a78bfa" stroke-width="1.5" />
    
    <!-- Nodes -->
    <circle cx="0" cy="-80" r="5" fill="#38bdf8" />
    <circle cx="75" cy="-30" r="5" fill="#818cf8" />
    <circle cx="48" cy="65" r="5" fill="#38bdf8" />
    <circle cx="-48" cy="65" r="5" fill="#818cf8" />
    <circle cx="-75" cy="-30" r="5" fill="#38bdf8" />
    <circle cx="0" cy="25" r="6" fill="#c084fc" />
  </g>
  
  <text x="300" y="295" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">GeomTorch: Lie Group Equivariance</text>
  <text x="300" y="325" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">SO(3) &amp; SE(3) Neural Operators in PyTorch</text>
</svg>
