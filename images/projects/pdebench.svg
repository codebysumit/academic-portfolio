<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="pdeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#pdeBg)" />
  
  <!-- Heatmap / Navier-Stokes Wave Surface -->
  <g transform="translate(300, 150)">
    <!-- Mesh lines -->
    <path d="M -200 40 Q -100 -50 0 30 T 200 -20" fill="none" stroke="url(#waveGrad)" stroke-width="4" />
    <path d="M -200 10 Q -100 -80 0 0 T 200 -50" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" opacity="0.7" />
    <path d="M -200 -20 Q -100 -110 0 -30 T 200 -80" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.4" />
    <path d="M -200 70 Q -100 -20 0 60 T 200 10" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" opacity="0.5" />
    
    <!-- Grid points -->
    <circle cx="-100" cy="-50" r="4" fill="#fbbf24" />
    <circle cx="0" cy="30" r="4" fill="#f87171" />
    <circle cx="100" cy="-10" r="4" fill="#a78bfa" />
  </g>
  
  <text x="300" y="295" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">SpectralPDE-Bench: Benchmark Suite</text>
  <text x="300" y="325" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">Navier-Stokes &amp; Maxwell PDE Operator Datasets</text>
</svg>
