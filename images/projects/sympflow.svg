<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="sympBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#sympBg)" />
  
  <!-- Phase Space Orbits -->
  <g transform="translate(300, 150)">
    <!-- Coordinate axes -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#065f46" stroke-width="1.5" />
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#065f46" stroke-width="1.5" />
    <text x="170" y="-8" fill="#6ee7b7" font-size="12" font-family="monospace">q (pos)</text>
    <text x="8" y="-75" fill="#6ee7b7" font-size="12" font-family="monospace">p (mom)</text>
    
    <!-- Symplectic Phase Ellipses (Invariant Tori) -->
    <ellipse cx="0" cy="0" rx="140" ry="70" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />
    <ellipse cx="0" cy="0" rx="100" ry="50" fill="none" stroke="url(#curveGrad)" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="55" ry="28" fill="rgba(16, 185, 129, 0.15)" stroke="#34d399" stroke-width="2" />
    
    <!-- Trajectory Point & Vector -->
    <circle cx="70" cy="-35" r="5" fill="#a7f3d0" />
    <line x1="70" y1="-35" x2="105" y2="-15" stroke="#fcd34d" stroke-width="2.5" marker-end="url(#arrow)" />
  </g>
  
  <text x="300" y="295" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">SympFlow: Hamiltonian Neural ODEs</text>
  <text x="300" y="325" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">Energy-Preserving Continuous Normalizing Flows</text>
</svg>
